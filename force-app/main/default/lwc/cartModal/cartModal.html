<template>
    <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-modal_large slds-fade-in-open">
        <div class="slds-modal__container">
            
            <header class="slds-modal__header">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleClose}>
                    <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                    <span class="slds-assistive-text">Close</span>
                </button>
                <h2 class="slds-text-heading_medium slds-hyphenate">Your Cart</h2>
            </header>
            
            <div class="slds-modal__content slds-p-around_medium">
                <template lwc:if={isCartEmpty}>
                    <div class="slds-text-align_center slds-m-top_medium slds-text-heading_small slds-text-color_weak">
                        Your cart is empty. Add some items first!
                    </div>
                </template>
                <template lwc:else>
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col"><div class="slds-truncate" title="Item Name">Item Name</div></th>
                                <th scope="col"><div class="slds-truncate" title="Price">Unit Price</div></th>
                                <th scope="col"><div class="slds-truncate" title="Quantity">Quantity</div></th>
                                <th scope="col"><div class="slds-truncate" title="Total">Total</div></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={cartItems} for:item="item">
                                <tr key={item.itemId}>
                                    <td data-label="Item Name"><div class="slds-truncate">{item.name}</div></td>
                                    <td data-label="Price"><div class="slds-truncate">${item.unitCost}</div></td>
                                    <td data-label="Quantity"><div class="slds-truncate">{item.quantity}</div></td>
                                    <td data-label="Total"><div class="slds-truncate"><strong>${item.totalPrice}</strong></div></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>

                    <div class="slds-m-top_medium slds-text-align_right slds-text-heading_small">
                        <strong>Grand Total: ${grandTotal}</strong>
                    </div>
                </template>
            </div>
            
            <footer class="slds-modal__footer">
                <lightning-button label="Close" onclick={handleClose}></lightning-button>
                <lightning-button label="Checkout" variant="success" onclick={handleCheckout} class="slds-m-left_small" disabled={isCartEmpty}></lightning-button>
            </footer>

        </div>
    </section>
    
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
