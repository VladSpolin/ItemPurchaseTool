<template>
    <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            
            <header class="slds-modal__header">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleCancel}>
                    <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                    <span class="slds-assistive-text">Close</span>
                </button>
                <h2 class="slds-text-heading_medium slds-hyphenate">Create New Item</h2>
            </header>
            
            <div class="slds-modal__content slds-p-around_medium">
                <lightning-input label="Item Name" name="name" value={name} onchange={handleChange} required></lightning-input>
                <lightning-textarea label="Description" name="description" value={description} onchange={handleChange}></lightning-textarea>
                
                <div class="slds-grid slds-gutters slds-m-top_small">
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-combobox label="Type" name="type" value={type} options={typeOptions} onchange={handleChange} required></lightning-combobox>
                    </div>
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-combobox label="Family" name="family" value={family} options={familyOptions} onchange={handleChange} required></lightning-combobox>
                    </div>
                </div>

                <div class="slds-grid slds-gutters slds-m-top_small">
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input type="number" label="Price" name="price" value={price} onchange={handleChange} formatter="currency" step="0.01" required></lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-input type="number" label="Available Quantity" name="quantity" value={quantity} onchange={handleChange} required></lightning-input>
                    </div>
                </div>
            </div>
            
            <footer class="slds-modal__footer">
                <lightning-button label="Cancel" onclick={handleCancel}></lightning-button>
                <lightning-button label="Save" variant="brand" onclick={handleSave} class="slds-m-left_small"></lightning-button>
            </footer>

        </div>
    </section>
    
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
